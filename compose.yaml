# Merge under services: in the existing SoulSync Compose stack.
# Keep the existing soulsync service and its network configuration.
# Adapt /srv host paths, profile directories, UID/GID and timezone to your setup.
services:
  soulsync-publisher:
    image: ghcr.io/mschabhuettl/soulsync-playlist-publisher:latest
    container_name: soulsync-publisher
    # Root is used only to initialize publisher directories, then privileges are dropped.
    user: "0:0"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: "service:soulsync"
    depends_on:
      soulsync:
        condition: service_started
    environment:
      PUID: "3007"
      PGID: "3007"
      TZ: Europe/Vienna
      MODE: dry-run
      INTERVAL_SECONDS: "300"
      CONFIG_PATH: /config/playlist-publisher.json
      PROFILE_RULES: >-
        {"alice":{"read_roots":["/music/Alice","/music/Shared"],"write_root":"/music/Alice"},
         "bob":{"read_roots":["/music/Bob","/music/Shared"],"write_root":"/music/Bob"}}
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      - type: bind
        source: /srv/soulsync/publisher/config
        target: /config
        bind:
          create_host_path: true
      - type: bind
        source: /srv/soulsync/publisher/state
        target: /state
        bind:
          create_host_path: true
      - type: bind
        source: /srv/soulsync/config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/soulsync/data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/downloads/soulsync
        target: /app/Transfer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/music
        target: /music
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/music/Alice
        target: /music/Alice
        bind:
          create_host_path: false
      - type: bind
        source: /srv/music/Bob
        target: /music/Bob
        bind:
          create_host_path: false
